<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客管理后台 · 牛皮纸手绘风</title>
<link rel="stylesheet" href="/admin/css/kraft.css">
</head>
<body>
<div class="wrap">

  <!-- ─────────── 登录视图 ─────────── -->
  <section id="view-login" class="login-wrap">
    <div class="login-card">
      <div class="doodle-top">
        <div class="swirl">☾✎✧</div>
        <div class="stars">★ ✦ ★ ✦ ★</div>
      </div>
      <h1 class="login-title">博客管理后台</h1>
      <p class="sub">内容与配置管理</p>
      <form id="login-form" autocomplete="off">
        <label class="login-label" for="login-password">管理员密码</label>
        <input type="password" id="login-password" autocomplete="current-password" placeholder="请输入 ADMIN_PASSWORD">
        <button type="submit" class="btn btn-primary btn-block">进入后台 ✏️</button>
      </form>
      <p class="hint" id="login-hint"></p>
    </div>
  </section>

  <!-- ─────────── 主视图 ─────────── -->
  <section id="view-main" class="hidden">

    <!-- 顶部应用栏 -->
    <header class="appbar">
      <div class="brand">一只喵⁹ 博客管理后台<span class="brand-sub">LuvGaze.com</span></div>
      <nav class="appbar-tabs">
        <a href="#" data-tab="content" class="active">📚 内容管理</a>
        <a href="#" data-tab="config">⚙️ 配置管理</a>
      </nav>
      <div class="appbar-right">
        <span class="blog-base-field" title="博客站点地址（「预览」按钮跳转用），修改后保存">
          <input type="text" id="blog-base-input" placeholder="博客地址 http://localhost:4321" spellcheck="false">
          <button type="button" class="btn btn-sm mini" id="btn-blog-base">保存地址</button>
        </span>
        <button type="button" class="btn btn-sm" id="btn-logout">退出</button>
      </div>
    </header>

    <div class="admin-layout">

      <!-- ── 内容管理 ── -->
      <div id="tab-content" class="tab-panel">
        <aside class="sidebar">
          <div class="sidebar-title">📚 内容模块<span class="count" id="module-count"></span></div>
          <div id="module-nav" class="side-nav"></div>
        </aside>
        <main class="main-panel">
          <div class="toolbar">
            <h2 id="content-panel-title" class="panel-title">请选择左侧模块</h2>
            <div class="toolbar-actions">
              <button id="btn-backups" class="btn btn-sm hidden">🗂 备份与恢复</button>
              <button id="btn-create" class="btn btn-sm btn-primary hidden">＋ 新建</button>
            </div>
          </div>
          <div class="panel-scroll">
            <div id="content-panel"></div>
          </div>
        </main>
      </div>

      <!-- ── 配置管理 ── -->
      <div id="tab-config" class="tab-panel hidden">
        <aside class="sidebar">
          <div class="sidebar-title">⚙️ 配置文件<span class="count" id="target-count"></span></div>
          <div id="target-nav" class="side-nav"></div>
        </aside>
        <main class="main-panel">
          <div class="toolbar">
            <h2 id="config-panel-title" class="panel-title">请选择左侧配置</h2>
            <div class="toolbar-actions">
              <button id="btn-save-config" class="btn btn-primary hidden">💾 保存配置</button>
            </div>
          </div>
          <div class="panel-scroll">
            <div id="config-panel"></div>
          </div>
        </main>
      </div>

    </div>

  </section>

</div>

<div id="toast-root"></div>

<!-- 通用弹窗 -->
<div id="modal-mask" class="modal-mask hidden">
  <div class="modal">
    <div class="modal-head">
      <span id="modal-title">提示</span>
      <button type="button" class="modal-close" id="modal-close">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<script src="/admin/js/app.js"></script>
</body>
</html>
